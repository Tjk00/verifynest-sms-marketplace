#:schema node_modules/wrangler/config-schema.json
name = "verifynest-sms-marketplace"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# ------------------------------------------------------------------
# D1 database (free plan: 5 GB storage, 5M rows read/day, 100k rows written/day)
# Create it once with:  npx wrangler d1 create verifynest-db
# then paste the printed database_id below.
# Apply migrations:     npx wrangler d1 migrations apply verifynest-db --remote
# ------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "verifynest-db"
# Placeholder UUID for local development. After `npx wrangler d1 create verifynest-db`,
# replace this with the real database_id that the command prints.
database_id = "11111111-1111-4111-8111-111111111111"
migrations_dir = "migrations"

# ------------------------------------------------------------------
# Static assets: the built React SPA (free plan: 20k files, 25 MiB each)
# Build first with `npm run build`, then `npx wrangler deploy`.
# /api/* requests run the Worker; everything else is served from assets
# with SPA fallback to index.html.
# ------------------------------------------------------------------
[assets]
directory = "./web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# ------------------------------------------------------------------
# Secrets (NEVER commit these; set them with `npx wrangler secret put NAME`):
#   ADMIN_BOOTSTRAP_TOKEN  — one-time token for creating the FIRST admin (>=16 chars)
#   NUMBEROTP_API_KEY      — only after written reseller approval from NumberOTP
#   PAYMENT_WEBHOOK_SECRET — only after a payment provider is selected
# ------------------------------------------------------------------

# Free-plan Worker limits (verify current numbers at developers.cloudflare.com):
#   100,000 requests/day, 10 ms CPU per invocation, 1,000 KV/D1 reads patterns etc.
# Observability is left at defaults; no paid bindings are used.
